{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password — THE VALORY{% endblock %}

{% block content %}
<section style="padding: 4rem 0;">
  <div class="container" style="max-width: 440px;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="subtitle">Account Recovery</div>
      <h2>Reset Your Password</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.5rem;">Enter your email to receive a password reset OTP code.</p>
    </div>

    <div style="background-color: var(--bg-card); border: 1px solid var(--border-dark); padding: 2rem;">
      <form method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label">Registered Email Address *</label>
          {{ form.email }}
        </div>

        <button type="submit" class="btn btn-gold" style="width: 100%; padding: 1rem;">
          Send Reset OTP Code
        </button>
      </form>
    </div>

  </div>
</section>
{% endblock %}
